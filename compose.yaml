services:
  caldav-proxy:
    build:
      context: .
    restart: unless-stopped
    init: true
    env_file:
      - .env
    ports:
      - '3000:3000'
    volumes:
      - ./data:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: [CMD, bun, -e, "const r=await fetch('http://127.0.0.1:3000/health');if(!r.ok)process.exit(1)"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
